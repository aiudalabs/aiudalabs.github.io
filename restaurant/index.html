<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RestaurantOS - Ordena desde tu mesa</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #8B1A0E 0%, #C8392B 50%, #D4A853 100%);
            color: white;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 420px;
            padding: 40px 30px;
            background: rgba(255,255,255,0.12);
            border-radius: 24px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { font-size: 3.5em; margin-bottom: 8px; }
        h1 { font-size: 2em; margin: 12px 0; font-weight: 700; }
        .subtitle { font-size: 1.1em; opacity: 0.9; line-height: 1.5; margin: 16px 0 32px; }
        .steps { text-align: left; margin: 24px 0; }
        .step {
            display: flex; align-items: center; gap: 14px;
            margin: 16px 0; font-size: 1.05em;
        }
        .step-icon {
            width: 44px; height: 44px; border-radius: 12px;
            background: rgba(255,255,255,0.15); display: flex;
            align-items: center; justify-content: center; font-size: 1.4em;
            flex-shrink: 0;
        }
        .footer { margin-top: 32px; font-size: 0.85em; opacity: 0.6; }
        .footer a { color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍽️</div>
        <h1>RestaurantOS</h1>
        <p class="subtitle">Escanea el QR de tu mesa para ver el menu y ordenar directamente desde tu telefono</p>
        <div class="steps">
            <div class="step">
                <div class="step-icon">📱</div>
                <span>Escanea el codigo QR en tu mesa</span>
            </div>
            <div class="step">
                <div class="step-icon">📋</div>
                <span>Explora el menu y elige tus platos</span>
            </div>
            <div class="step">
                <div class="step-icon">🛒</div>
                <span>Envia tu pedido directo a la cocina</span>
            </div>
            <div class="step">
                <div class="step-icon">🔔</div>
                <span>Recibe tu comida cuando este lista</span>
            </div>
        </div>
        <div class="footer">
            <p>Powered by <a href="https://aiudalabs.com">AiudaLabs</a></p>
        </div>
    </div>
</body>
</html>
